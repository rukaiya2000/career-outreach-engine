<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="iG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#bgG)"/>

  <!-- Subtle inner glow ring -->
  <rect width="100" height="100" rx="22" fill="none" stroke="url(#iG)" stroke-width="1.2" opacity="0.25"/>

  <!-- Briefcase body -->
  <rect x="20" y="46" width="60" height="38" rx="6" fill="none" stroke="url(#iG)" stroke-width="2.8"/>
  <!-- Briefcase handle -->
  <path d="M34 46 L34 39 Q34 33 40 33 L60 33 Q66 33 66 39 L66 46" fill="none" stroke="url(#iG)" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Center latch -->
  <rect x="43" y="59" width="14" height="9" rx="3" fill="url(#iG)" opacity="0.9"/>

  <!-- Paper plane (top right) -->
  <g transform="translate(65, 18) rotate(40)">
    <path d="M0 0 L16 6 L0 12 L4 6 Z" fill="url(#iG)"/>
  </g>

  <!-- Flight trail dots -->
  <circle cx="60" cy="24" r="1.5" fill="#38bdf8" opacity="0.5"/>
  <circle cx="65" cy="20" r="1.2" fill="#38bdf8" opacity="0.35"/>
  <circle cx="70" cy="16" r="1" fill="#38bdf8" opacity="0.2"/>
</svg>
