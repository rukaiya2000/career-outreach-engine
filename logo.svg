<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background pill -->
  <rect width="400" height="120" rx="16" fill="url(#bgGrad)"/>

  <!-- Icon container circle -->
  <circle cx="60" cy="60" r="38" fill="#1e3a5f" opacity="0.6"/>
  <circle cx="60" cy="60" r="38" fill="none" stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.8"/>

  <!-- Briefcase body -->
  <rect x="38" y="54" width="44" height="28" rx="4" fill="none" stroke="url(#iconGrad)" stroke-width="2.2"/>
  <!-- Briefcase handle -->
  <path d="M50 54 L50 49 Q50 45 54 45 L66 45 Q70 45 70 49 L70 54" fill="none" stroke="url(#iconGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Briefcase center latch -->
  <rect x="56" y="63" width="8" height="6" rx="2" fill="url(#iconGrad)" opacity="0.9"/>

  <!-- Paper plane accent (top-right of icon) -->
  <g transform="translate(78, 28) rotate(35)" filter="url(#glow)">
    <path d="M0 0 L14 5 L0 10 L3 5 Z" fill="url(#accentGrad)" opacity="0.95"/>
    <path d="M3 5 L8 8" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Dotted flight trail -->
  <path d="M74 46 Q85 38 88 32" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2,3" opacity="0.45" fill="none"/>

  <!-- Wordmark: Job -->
  <text x="116" y="52" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="36" letter-spacing="-1" fill="#f1f5f9">Job</text>

  <!-- Wordmark: Pilot (gradient) -->
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>
  <text x="116" y="88" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="36" letter-spacing="-1" fill="url(#textGrad)">Pilot</text>

  <!-- Tagline -->
  <text x="118" y="106" font-family="'SF Pro Text', 'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="11" letter-spacing="2.5" fill="#64748b">AUTOMATED JOB ENGINE</text>

  <!-- Subtle right accent line -->
  <line x1="376" y1="30" x2="376" y2="90" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
</svg>
